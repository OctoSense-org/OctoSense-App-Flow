name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  onboarding:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Starter and executable discovery regressions
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Script app verify skill (runner logic, no card-host)
        run: python -m unittest discover -s skills/splash-app-verify/scripts -p "test_*.py" -v

  rust-sdk:
    # The Rust SDK for app components (OctoSense ADR 0014): the macro, the
    # example components built for wasm32-wasip2 and run in Wasmtime with
    # WASI 0.2, then `octo wasm` reading them and building a new crate.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-flow
    steps:
      - uses: actions/checkout@v6
        with:
          path: app-flow
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rust with the wasm32-wasip2 target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-wasip2
      - name: Macro, examples and end-to-end tests
        working-directory: app-flow/sdk/rust
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace
      - name: octo wasm with cargo and the built components
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Read the publisher pin
        id: publisher
        run: |
          python - <<'PY'
          import json, os
          pin = json.load(open('tools/publisher-toolchain.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + pin['revision'] + '\n')
          PY
      - uses: actions/checkout@v6
        with:
          repository: OctoSense-org/OctoSense-App-Hub
          ref: ${{ steps.publisher.outputs.revision }}
          path: publisher-tools/app-hub
          persist-credentials: false
      - name: Prepare the publisher runtime sources
        run: python tools/setup-native.py --root ../publisher-tools
      - name: Pinned publisher admits current components and retains proof checks
        run: python tools/check-publisher-toolchain.py --hub-source ../publisher-tools/app-hub

  flows:
    # macOS: the image library's OCR and the flows' native tooling are
    # macOS-only, and the tests are only verified there.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          # A clean parent directory: setup-native.py prepares the shared
          # runtime (makepad, octoscript, octoscript-makepad) beside the repo.
          path: octosense-org/OctoSense-App-Flow

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare the shared Octoscript-Makepad runtime
        working-directory: octosense-org/OctoSense-App-Flow
        run: |
          python tools/setup-native.py --root ../
          python tools/setup-native.py --check --root ../

      - name: Runtime setup safeguards
        working-directory: octosense-org/OctoSense-App-Flow
        run: PYTHONPATH=flows python -m unittest core.test_native_runtime

      - name: Calendar native examples reproduce from committed locks
        working-directory: octosense-org/OctoSense-App-Flow
        run: |
          cargo check --locked --manifest-path examples/calendar/app/Cargo.toml
          cargo check --locked --manifest-path examples/calendar/native/Cargo.toml

      - name: Environments (image library and Sketch kit pin different NumPy majors)
        working-directory: octosense-org/OctoSense-App-Flow
        run: |
          python -m venv "$RUNNER_TEMP/image" && "$RUNNER_TEMP/image/bin/pip" install -q -r flows/image-lib/requirements.txt
          python -m venv "$RUNNER_TEMP/sketch" && "$RUNNER_TEMP/sketch/bin/pip" install -q -r flows/kits/sketch/requirements.txt

      - name: image-to-card flow tests
        working-directory: octosense-org/OctoSense-App-Flow
        run: |
          "$RUNNER_TEMP/image/bin/python" -m unittest discover -s flows/image-to-card -p 'test_*.py'
          "$RUNNER_TEMP/image/bin/python" -m unittest discover -s flows/image-to-card/wasm -p 'test_*.py'

      - name: Core tests
        working-directory: octosense-org/OctoSense-App-Flow
        run: |
          "$RUNNER_TEMP/sketch/bin/python" -m unittest discover -s flows/core -p 'test_*.py'

      - name: Sketch kit flow tests
        working-directory: octosense-org/OctoSense-App-Flow
        run: |
          "$RUNNER_TEMP/sketch/bin/python" -m unittest discover -s flows/kits/sketch -p 'test_*.py'

      - name: Maintenance tests
        working-directory: octosense-org/OctoSense-App-Flow
        run: python -m unittest discover -s flows/tests -p 'test_*.py'

      # flows/image-lib's own tests read ignored per-design capture rounds
      # (flows/image-lib/*/rounds/), which a fresh checkout does not have;
      # they run locally, not here.

      - name: Every example manifest plans
        working-directory: octosense-org/OctoSense-App-Flow
        run: |
          for example in aircon school health reunion calendar; do
            bash tools/image-to-appcard-flow.sh plan \
              --project "$PWD/examples/$example" \
              --manifest "$PWD/examples/$example/image-to-appcard-flow.json" > /dev/null
          done

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Relative Markdown links resolve
        run: python tools/check-links.py
      - name: Android model archive replay
        run: |
          python examples/android-a2app-card-templates/test-import-snapshot.py
          python examples/android-a2app-card-templates/validate-model-authorship.py \
            --case-dir attempts/deepseek-r3 --case-dir attempts/minimax-r3 \
            --case-dir collection --case-dir continuations/deepseek/turn-12 \
            --case-dir continuations/minimax/turn-14
          python examples/android-a2app-card-templates/continuations/deepseek/workspace-ux-20261005/verify.py
          python examples/android-a2app-card-templates/continuations/minimax/workspace-ux-20261005/verify.py
